name: Automatic ROM Porter for Xiaomi Blossom

on:
  workflow_dispatch:
    inputs:
      port_rom_url:
        description: "Port ROM Direct Download URL (Target ROM to port to Blossom)"
        required: true
        type: string
      base_rom_url:
        description: "Base ROM Direct Download URL (Stock Blossom Fastboot / ZIP - Optional)"
        required: false
        type: string
        default: ""
      target_variant:
        description: "Target Device Variant"
        required: true
        type: choice
        options:
          - blossom
          - dandelion
          - angelica
          - angelican
          - cattail
        default: blossom
      rom_type:
        description: "ROM Name / Type (e.g. HyperOS, MIUI14, PixelOS, LineageOS, OneUI)"
        required: true
        type: string
        default: "HyperOS"
      build_super_img:
        description: "Build Dynamic Super.img (via lpmake)?"
        required: true
        type: boolean
        default: true
      disable_encryption:
        description: "Disable Forced Encryption in Fstab?"
        required: true
        type: boolean
        default: true
      disable_avb_verity:
        description: "Disable AVB dm-verity in VBMeta?"
        required: true
        type: boolean
        default: true
      upload_release:
        description: "Upload to GitHub Releases?"
        required: true
        type: boolean
        default: true
      custom_upload_url:
        description: "Custom Upload URL (Optional: e.g. https://transfer.sh/ or custom HTTP server)"
        required: false
        type: string
        default: ""

jobs:
  heavy-port-engine:
    name: Heavy Port Engine (${{ inputs.target_variant }} - ${{ inputs.rom_type }})
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 2. Maximize Runner Disk Space (Free up 45GB+ NVMe SSD)
        run: |
          echo "Maximizing runner disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /usr/share/swift /usr/local/graalvm /usr/lib/jvm/*
          sudo docker image prune --all --force 2>/dev/null || true
          df -h

      - name: 3. Set up Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 4. Install Full Android OS Build & Partition Toolchain
        run: |
          echo "Installing system packages and Android build toolchain..."
          sudo apt-get update
          sudo apt-get install -y aria2 p7zip-full zstd brotli liblz4-tool \
            e2fsprogs simg2img aapt zipalign apksigner android-framework-res curl wget tree jq openjdk-17-jre-headless

          # Install payload-dumper-go
          PAYLOAD_URL="https://github.com/ssut/payload-dumper-go/releases/download/1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz"
          wget -qO- "$PAYLOAD_URL" | sudo tar -xz -C /usr/local/bin payload-dumper-go
          sudo chmod +x /usr/local/bin/payload-dumper-go

          # Install lpmake and lpunpack for Dynamic Super Partitions
          wget -qO /tmp/lpmake.zip "https://github.com/carlitoxxpro/lpmake/releases/download/v1.0/lpmake-x86_64.zip" || true
          if [ -f /tmp/lpmake.zip ]; then
            sudo unzip -o /tmp/lpmake.zip -d /usr/local/bin/ || true
            sudo chmod +x /usr/local/bin/lpmake /usr/local/bin/lpunpack 2>/dev/null || true
          fi

          echo "Environment toolchain validation:"
          which aapt zipalign apksigner simg2img payload-dumper-go lpmake lpunpack || true

      - name: 5. Compile and Sign Blossom RRO Overlays from Source
        run: |
          echo "Compiling and signing RRO overlays..."
          python3 tools/build_overlays.py --rro-dir rro_overlays --output-dir apks
          python3 tools/create_magisk_module.py

      - name: 6. Run Device Tree Integrity Validation
        run: |
          echo "Validating repository tree health..."
          python3 tools/verify_tree.py

      - name: 7. Run Heavy-Duty End-to-End Porting Engine
        id: run_heavy_port
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          WORK_DIR="/tmp/blossom_auto_port"
          LOGS_DIR="$WORK_DIR/logs"
          mkdir -p "$LOGS_DIR"

          BASE_ARG=""
          if [ -n "${{ inputs.base_rom_url }}" ]; then
            BASE_ARG="--base-url '${{ inputs.base_rom_url }}'"
          fi

          UPLOAD_ARG=""
          if [ -n "${{ inputs.custom_upload_url }}" ]; then
            UPLOAD_ARG="--upload-url '${{ inputs.custom_upload_url }}'"
          fi

          echo "Executing AutoPorter pipeline with full partition merge and injection..."
          python3 tools/auto_porter.py \
            --port-url "${{ inputs.port_rom_url }}" \
            $BASE_ARG \
            $UPLOAD_ARG \
            --variant "${{ inputs.target_variant }}" \
            --rom-type "${{ inputs.rom_type }}" \
            --work-dir "$WORK_DIR" 2>&1 | tee "$LOGS_DIR/porting_execution.log"

          # Export output artifact paths
          ROM_ZIP=$(ls $WORK_DIR/output/*.zip | head -n 1)
          META_JSON=$(ls $WORK_DIR/output/*.json | head -n 1)
          echo "ROM_PATH=$ROM_ZIP" >> $GITHUB_ENV
          echo "META_PATH=$META_JSON" >> $GITHUB_ENV
          echo "ROM_NAME=$(basename $ROM_ZIP)" >> $GITHUB_ENV
          echo "WORK_DIR=$WORK_DIR" >> $GITHUB_ENV
          echo "LOGS_DIR=$LOGS_DIR" >> $GITHUB_ENV

      - name: 8. Run Pre-Release Anti-Brick Safety Audit
        run: |
          echo "Executing Anti-Brick Safety Guard on built ROM package..."
          python3 tools/unbrick_safety_guard.py --rom-zip "${{ env.ROM_PATH }}"

      - name: 9. Upload to Multi-Cloud Mirrors (Pixeldrain, Transfer.sh, Custom)
        if: success()
        run: |
          CUSTOM_ARG=""
          if [ -n "${{ inputs.custom_upload_url }}" ]; then
            CUSTOM_ARG="--custom-url '${{ inputs.custom_upload_url }}'"
          fi

          python3 tools/multi_uploader.py \
            --file "${{ env.ROM_PATH }}" \
            $CUSTOM_ARG \
            --output-md "${{ env.LOGS_DIR }}/mirrors_summary.md" || true

      - name: 10. Run Real-time AI Porting Diagnostics and Error Analysis
        if: always()
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          LOG_FILE="${{ env.LOGS_DIR }}/porting_execution.log"
          if [ -f "$LOG_FILE" ]; then
            python3 tools/ai_assistant.py \
              --log-file "$LOG_FILE" \
              --output-md "${{ env.LOGS_DIR }}/ai_report.md"
            
            cat "${{ env.LOGS_DIR }}/ai_report.md" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f "${{ env.LOGS_DIR }}/mirrors_summary.md" ]; then
            echo -e "\n" >> $GITHUB_STEP_SUMMARY
            cat "${{ env.LOGS_DIR }}/mirrors_summary.md" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 11. Upload Build Logs and Diagnostics Artifacts (Always Executed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Blossom_Port_Diagnostics_Logs
          path: /tmp/blossom_auto_port/logs/
          retention-days: 14

      - name: 12. Upload Ported ROM Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ROM_NAME }}
          path: /tmp/blossom_auto_port/output/
          retention-days: 7

      - name: 13. Create GitHub Release and Publish ROM
        if: success() && inputs.upload_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "port-${{ inputs.rom_type }}-${{ inputs.target_variant }}-${{ github.run_number }}"
          name: "${{ inputs.rom_type }} Port for Xiaomi Blossom (${{ inputs.target_variant }})"
          body: |
            ## Xiaomi Blossom Ported ROM Release

            - ROM Name / Type: `${{ inputs.rom_type }}`
            - Target Variant: `${{ inputs.target_variant }}` (Redmi 9A / 9C / 9 Activ / Poco C3)
            - Port Source URL: `${{ inputs.port_rom_url }}`
            - Build Number: `#${{ github.run_number }}`
            - Commit: `${{ github.sha }}`

            ### Hardware & Partition Fixes Applied
            - Preserved Blossom Kernel (`boot.img` v2 header), DTBO, and Vendor HALs
            - Disabled AVB dm-verity in `vbmeta.img` (`flags=3`)
            - Waterdrop Notch Cutout (`M 0,0 H -64 V 60 H 64 V 0 H 0 Z`)
            - Status Bar Height (`56.0px`) & Rounded Corners (`33dp`)
            - Auto-Brightness Lux/Nits Spline Calibration
            - MediaTek `GraphicBufferMapper` & `libui-v32.so` Shims
            - Dual 4G VoLTE / CarrierConfig Provisioning
            - Cross-platform Fastboot Flasher scripts (`flash_all.sh` & `flash_all.bat`)
            - Pre-bundled `Blossom_Notch_Fix_Magisk.zip`

            ### Flashing Instructions (Fastboot)
            1. Extract the downloaded ZIP file.
            2. Connect phone in Fastboot mode.
            3. Run `flash_all.bat` (Windows) or `./flash_all.sh` (Linux/macOS).
            4. The script will flash `boot`, `dtbo`, `vbmeta`, reboot into FastbootD, flash `super.img`, wipe data, and reboot.

            ### Flashing Instructions (Recovery)
            1. Boot into TWRP / OrangeFox.
            2. Wipe Dalvik, Cache, System, Vendor, Data.
            3. Flash the ROM ZIP, format data (type `yes`), and reboot.
          files: |
            /tmp/blossom_auto_port/output/*.zip
            /tmp/blossom_auto_port/output/*.json
            /tmp/blossom_auto_port/logs/ai_report.md
            Blossom_Notch_Fix_Magisk.zip
          draft: false
          prerelease: false
